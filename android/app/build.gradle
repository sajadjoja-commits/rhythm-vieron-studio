apply plugin: 'com.android.application'

def getBuildInfoVersionCode() {
    try {
        def buildInfoFile = file("../../src/build_info.json")
        if (buildInfoFile.exists()) {
            def parsed = new groovy.json.JsonSlurper().parseText(buildInfoFile.text)
            if (parsed.build) {
                return parsed.build.toInteger()
            }
        }
    } catch (Exception ignored) {
    }
    return 1
}

android {
    namespace = "com.vireon.ai"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.vireon.ai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode getBuildInfoVersionCode()
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            noCompress 'bin'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-O3 -fexceptions -frtti"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    signingConfigs {
        release {
            def storeFilePath = System.getenv("RELEASE_STORE_FILE") ?: (project.hasProperty('RELEASE_STORE_FILE') ? project.property('RELEASE_STORE_FILE') : null)
            if (storeFilePath && file(storeFilePath).exists()) {
                storeFile file(storeFilePath)
                storePassword System.getenv("RELEASE_STORE_PASSWORD") ?: (project.hasProperty('RELEASE_STORE_PASSWORD') ? project.property('RELEASE_STORE_PASSWORD') : "")
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: (project.hasProperty('RELEASE_KEY_ALIAS') ? project.property('RELEASE_KEY_ALIAS') : "")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: (project.hasProperty('RELEASE_KEY_PASSWORD') ? project.property('RELEASE_KEY_PASSWORD') : "")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                gradle.taskGraph.whenReady { taskGraph ->
                    if (taskGraph.hasTask(":app:assembleRelease") || taskGraph.hasTask(":app:bundleRelease")) {
                        throw new GradleException("RELEASE BUILD FAILED: Release keystore is missing! Set RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD in environment.")
                    }
                }
            }
        }
    }
    
    // Performance: Large heap for AI processing
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "RhythmVieron-${variant.name}-${variant.versionName}.apk"
        }
    }
}

// Repositories moved to dependency level via fileTree

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation fileTree(include: ['*.jar', '*.aar'], dir: '../capacitor-cordova-android-plugins/src/main/libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    
    // Google ML Kit Subject Segmentation & Face Detection (Official On-Device Android Native AI)
    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
    implementation 'com.google.android.gms:play-services-mlkit-face-detection:17.1.0'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

task verifyWebAssets {
    group = "vieron"
    description = "Strictly verifies that Android web assets are fresh, synchronized, and match dist"
    doLast {
        def distIndex = file("../../dist/index.html")
        def androidIndex = file("src/main/assets/public/index.html")
        def distFingerprint = file("../../dist/fingerprint.txt")
        def androidFingerprint = file("src/main/assets/public/fingerprint.txt")
        def distBuildInfo = file("../../dist/build_info.json")
        def androidBuildInfo = file("src/main/assets/public/build_info.json")

        if (!distIndex.exists()) {
            throw new GradleException("\n=========================================\nVIERON STUDIO BUILD BLOCKED\n=========================================\nMissing web build directory: dist/index.html does not exist!\nYou MUST run:\n  npm run build:android\nbefore building APK in Android Studio.\n=========================================\n")
        }

        if (!androidIndex.exists()) {
            throw new GradleException("\n=========================================\nVIERON STUDIO BUILD BLOCKED\n=========================================\nMissing Android web assets: android/app/src/main/assets/public/index.html does not exist!\nYou MUST run:\n  npm run build:android\nbefore building APK in Android Studio.\n=========================================\n")
        }

        if (!distFingerprint.exists() || !androidFingerprint.exists()) {
            throw new GradleException("\n=========================================\nVIERON STUDIO BUILD BLOCKED\n=========================================\nMissing fingerprint.txt in dist or android assets!\nYou MUST run:\n  npm run build:android\nbefore building APK in Android Studio.\n=========================================\n")
        }

        if (!distBuildInfo.exists() || !androidBuildInfo.exists()) {
            throw new GradleException("\n=========================================\nVIERON STUDIO BUILD BLOCKED\n=========================================\nMissing build_info.json in dist or android assets!\nYou MUST run:\n  npm run build:android\nbefore building APK in Android Studio.\n=========================================\n")
        }

        def distHash = distFingerprint.text.trim()
        def androidHash = androidFingerprint.text.trim()

        if (distHash.isEmpty() || androidHash.isEmpty() || distHash != androidHash) {
            throw new GradleException("\n=========================================\nVIERON STUDIO BUILD BLOCKED: ASSET MISMATCH\n=========================================\nAndroid web assets are STALE or do not match dist!\nDist fingerprint:    " + distHash + "\nAndroid fingerprint: " + androidHash + "\n\nYou MUST run:\n  npm run build:android\nbefore building APK in Android Studio.\n=========================================\n")
        }

        println("\n[VIERON GRADLE GUARD] PASS: Android assets match dist perfectly (${distHash.take(12)}...)\n")
    }
}

// Ensure web assets are strictly verified before any build happens
preBuild.dependsOn verifyWebAssets

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
