name: Vieron OTA Deployment (Staging)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual update'

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Build and Deploy to Capgo Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Environment Audit
        run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          echo "Git SHA: ${GITHUB_SHA::7}"
          echo "App ID: 4ff5064c-bd8c-4b62-b998-25e5da1d59c5"
          echo "Channel: staging"

      - name: Vieron Asset Sync & Validation
        run: npm run vieron:sync

      - name: Verify Build Artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory missing after build."
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "Error: index.html missing in dist."
            exit 1
          fi
          echo "Build artifacts verified."

      - name: Deploy to Capgo
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          if [ -z "$CAPGO_TOKEN" ]; then
            echo "Error: CAPGO_TOKEN secret is missing in GitHub repository settings."
            exit 1
          fi
          
          npx @capgo/cli@latest bundle upload \
            --app-id "4ff5064c-bd8c-4b62-b998-25e5da1d59c5" \
            --channel "staging" \
            --version "web-${GITHUB_SHA::7}" \
            --path "dist" \
            --token "$CAPGO_TOKEN"
