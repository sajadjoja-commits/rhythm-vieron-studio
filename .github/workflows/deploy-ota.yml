name: Deploy Vieron OTA

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      promote_to_production:
        description: 'Set to "true" to promote the staging bundle to production'
        required: false
        default: 'false'

jobs:
  build-and-deploy-staging:
    name: Build and Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.promote_to_production != 'true')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Deploy to Capgo Staging
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          # The app ID is taken from capacitor.config.ts
          # We use a version string that includes the commit SHA for traceability
          npx @capgo/cli@latest bundle upload \
            --app-id "4ff5064c-bd8c-4b62-b998-25e5da1d59c5" \
            --channel "staging" \
            --version "web-${GITHUB_SHA::7}" \
            --path "dist" \
            --token "$CAPGO_TOKEN"

  promote-to-production:
    name: Promote Staging to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.promote_to_production == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Promote Staging to Production on Capgo
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          # This command promotes the latest bundle in staging to production
          # You might need to specify the exact version if preferred
          npx @capgo/cli@latest channel set \
            --app-id "4ff5064c-bd8c-4b62-b998-25e5da1d59c5" \
            --channel "production" \
            --bundle-id "latest" \
            --from "staging" \
            --token "$CAPGO_TOKEN"
