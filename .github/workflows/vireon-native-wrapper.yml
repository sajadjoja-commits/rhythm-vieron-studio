name: Build Vireon native wrapper

on:
  push:
    branches:
      - feat/vireon-native-rebuild
    paths:
      - "vireon-android-wrapper/**"
      - ".github/workflows/vireon-native-wrapper.yml"
  pull_request:
    paths:
      - "vireon-android-wrapper/**"
      - ".github/workflows/vireon-native-wrapper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-wrapper:
    name: Compile native Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vireon-android-wrapper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vireon-native-debug-apk
          path: vireon-android-wrapper/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
