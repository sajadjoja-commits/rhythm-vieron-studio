name: Native Android shell build

on:
  push:
    branches:
      - feat/native-shell
    paths:
      - "android-shell/**"
      - "src/services/NativeService.ts"
      - ".github/workflows/native-shell-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vireon-native-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Build and verify installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Gradle wrapper
        working-directory: android-shell
        run: ./gradlew --no-daemon --version

      - name: Assemble debug APK
        working-directory: android-shell
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="android-shell/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee android-shell/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vireon-native-shell-debug
          path: |
            android-shell/app/build/outputs/apk/debug/app-debug.apk
            android-shell/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
